name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/checks.yml
  release:
    name: Publish npm Package and GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check Out Release History
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set Up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish Version and Release Notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release
      - name: Verify Tagged Version from npm
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*')
          if [[ -n "$tag" ]]; then pnpm run test:package "${tag#v}"; fi
