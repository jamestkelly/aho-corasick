name: Checks
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  workflow_call:
permissions:
  contents: read

jobs:
  validate:
    name: Validate Library and Release Tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set Up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Release Configuration
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { plugins } = JSON.parse(readFileSync('.releaserc.json', 'utf8'));
          for (const [name] of plugins) await import(name);
          JS
      - name: Validate Library
        run: pnpm validate
      - name: Require TypeScript for Scripts
        run: |
          if git ls-files scripts doc | grep -E '\.(js|cjs|mjs)$'; then
            echo 'Use TypeScript for repository scripts and runnable examples.'
            exit 1
          fi
  branch-name:
    name: Validate Source Branch
    if: github.event_name == 'pull_request'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name
        uses: jamestkelly/branch-name-check@1cb7c8ecfab5ec076f278a9b3c84f9ae108e49e1 # v1.0.0
  pr-title:
    name: Validate PR Title
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional PR Title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
  review-gate:
    # Keep the status context required by the main branch ruleset.
    name: Review Gate / Validate
    if: always() && github.event_name == 'pull_request'
    needs: [validate, branch-name, pr-title]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Review Results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
